<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة التحكم - KR&BR</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="dashboard.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="dash-body">

  <nav class="dash-nav">
    <div class="nav-brand"><span class="brand-kr">KR</span><span class="brand-amp">&</span><span class="brand-br">BR</span></div>
    <div class="dash-nav-links">
      <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
    </div>
    <div class="dash-user" id="dash-user-info"></div>
    <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
  </nav>

  <div class="dash-layout">
    <!-- Sidebar -->
    <aside class="dash-sidebar">
      <div class="sidebar-avatar" id="sidebar-avatar"></div>
      <nav class="sidebar-nav">
        <button class="snav active" data-panel="overview"><i class="fas fa-chart-pie"></i> نظرة عامة</button>
        <button class="snav" data-panel="visa"><i class="fas fa-credit-card"></i> ربط الفيزا</button>
        <button class="snav" data-panel="purchases" id="btn-purchases"><i class="fas fa-shopping-bag"></i> مشترياتي</button>
        <button class="snav" data-panel="products" id="btn-products"><i class="fas fa-box"></i> منتجاتي</button>
        <button class="snav" data-panel="earnings" id="btn-earnings"><i class="fas fa-wallet"></i> أرباحي</button>
        <button class="snav" data-panel="add-product" id="btn-add"><i class="fas fa-plus-circle"></i> إضافة منتج</button>
      </nav>
    </aside>

    <!-- Main -->
    <main class="dash-main">
      <!-- Overview -->
      <div class="panel active" id="panel-overview">
        <h2 class="panel-title">نظرة عامة</h2>
        <div class="stats-grid" id="overview-stats"></div>
        <div class="recent-section">
          <h3>آخر المعاملات</h3>
          <div id="recent-tx"></div>
        </div>
      </div>

      <!-- Visa -->
      <div class="panel" id="panel-visa">
        <h2 class="panel-title"><i class="fas fa-credit-card"></i> ربط بطاقة الفيزا</h2>
        <div class="visa-card-preview" id="visa-preview"></div>
        <form id="visa-form" onsubmit="saveVisa(event)">
          <div class="form-group">
            <label><i class="fas fa-credit-card"></i> رقم البطاقة</label>
            <input type="text" id="visa-number" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" oninput="formatCard(this)"/>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-calendar"></i> تاريخ الانتهاء</label>
              <input type="text" id="visa-expiry" placeholder="MM/YY" maxlength="5" oninput="formatExpiry(this)"/>
            </div>
            <div class="form-group">
              <label><i class="fas fa-lock"></i> CVV</label>
              <input type="password" id="visa-cvv" placeholder="•••" maxlength="3"/>
            </div>
          </div>
          <div class="form-group">
            <label><i class="fas fa-user"></i> اسم حامل البطاقة</label>
            <input type="text" id="visa-name" placeholder="الاسم كما هو على البطاقة"/>
          </div>
          <button type="submit" class="btn-submit"><i class="fas fa-save"></i> حفظ البطاقة</button>
        </form>
      </div>

      <!-- Purchases -->
      <div class="panel" id="panel-purchases">
        <h2 class="panel-title"><i class="fas fa-shopping-bag"></i> مشترياتي</h2>
        <div id="purchases-list"></div>
      </div>

      <!-- My Products (seller) -->
      <div class="panel" id="panel-products">
        <h2 class="panel-title"><i class="fas fa-box"></i> منتجاتي</h2>
        <div id="my-products-list"></div>
      </div>

      <!-- Earnings (seller) -->
      <div class="panel" id="panel-earnings">
        <h2 class="panel-title"><i class="fas fa-wallet"></i> أرباحي</h2>
        <div id="earnings-content"></div>
      </div>

      <!-- Add Product (seller) -->
      <div class="panel" id="panel-add-product">
        <h2 class="panel-title"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h2>
        <form id="add-product-form" onsubmit="addProduct(event)">
          <div class="form-group">
            <label>اسم المنتج</label>
            <input type="text" id="p-name" placeholder="اسم المنتج" required/>
          </div>
          <div class="form-group">
            <label>وصف المنتج</label>
            <textarea id="p-desc" placeholder="وصف تفصيلي للمنتج" rows="3" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Cairo',sans-serif;resize:vertical;outline:none" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>الفئة</label>
              <select id="p-cat">
                <option value="websites">موقع إلكتروني</option>
                <option value="games">لعبة</option>
                <option value="mobile">تطبيق موبايل</option>
                <option value="desktop">برنامج Desktop</option>
              </select>
            </div>
            <div class="form-group">
              <label>السعر (USD)</label>
              <input type="number" id="p-price" placeholder="0.00" min="1" required/>
            </div>
          </div>
          <div class="form-group">
            <label>أيقونة (emoji)</label>
            <input type="text" id="p-icon" placeholder="مثال: 🚀" maxlength="2"/>
          </div>
          <div class="commission-note">
            <i class="fas fa-info-circle"></i>
            سيتم خصم 10% من كل عملية بيع كعمولة للمنصة وإرسالها تلقائياً لفيزا المدير
          </div>
          <button type="submit" class="btn-submit"><i class="fas fa-plus"></i> نشر المنتج</button>
        </form>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
